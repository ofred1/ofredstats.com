<style>
:root {

* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; }

input, select, button { font: inherit; }
input[type=search], select {

button { cursor: pointer; }
.btn {

input:focus-visible, select:focus-visible {

}
.tablewrap { overflow: auto; max-height: 700px; }
table {

}
th {

}
th button {

}
td {

  border-bottom: 1px solid #eff2f6;

}
tr:hover td { background: #f7faff; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.num button { text-align: right; }
.teamlink {
  display: flex;
  align-items: center;
  gap: 11px;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 650;
  color: #172840;
  font-size: 13px;
  text-align: left;
}
.logoslot {
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.logoslot img { width: 100%; height: 100%; object-fit: contain; }
.logoslot.large { width: 56px; height: 56px; }
.rankcell { color: #6a7890; }
.score { font-weight: 750; color: #2864da; background: #f7faff; }
.count {
  padding: 15px 24px;
  color: #748095;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.notice {
  font-size: 12px;
  color: #65728a;
  margin-top: 14px;
  line-height: 1.6;
}
.notice[hidden] { display: none; }
.method {
  margin-top: 35px;
  padding: 25px;
  background: white;
  border: 1px solid #dde3ed;
  border-radius: 9px;
}
.method h2 { margin: 0 0 14px; font-size: 25px; }
.method h3 { font-size: 16px; }
.method h3 span {
  font-size: 11px;
  background: #edf3fe;
  color: #2864da;
  border-radius: 4px;
  padding: 5px 8px;
  margin-left: 8px;
}
.formula {
  font-family: ui-monospace, monospace;
  font-size: 15px;
  background: #f2f5fb;
  border-left: 3px solid #2864da;
  padding: 17px;
}
.method p { max-width: 840px; }
.method small { color: #748095; line-height: 1.6; display: block; }
footer {
  font-size: 11px;
  color: #8993a4;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 28px 0;
}
dialog {
  border: 1px solid #dce3ed;
  border-radius: 12px;
  max-width: 550px;
  width: calc(100% - 32px);
  padding: 26px;
  color: #18243c;
}
dialog::backdrop { background: #13223b70; }
.dialoghead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.teamheading { display: flex; align-items: center; gap: 14px; }
.dialoghead h2 { margin: 0; font-size: 23px; }
.detailgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}
.detailgrid div { padding: 16px; background: #f4f7fb; border-radius: 6px; }
.detailgrid small {
  display: block;
  color: #758096;
  font-size: 11px;
  margin-bottom: 8px;
}
.detailgrid strong { font-size: 22px; }
#column-tip {
  position: fixed;
  z-index: 100;
  width: 280px;
  background: #172840;
  color: white;
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 0 8px 28px #17284030;
  pointer-events: none;
}
#column-tip strong { display: block; font-size: 12px; margin-bottom: 7px; }
#column-tip span {
  display: block;
  font-size: 12px;
  line-height: 1.6;
  color: #dce6f7;
}
.visually-hidden {
  position: absolute;
  clip-path: inset(100%);
  width: 1px;
  height: 1px;
  overflow: hidden;
}
@media (max-width: 700px) {
  .nav { padding: 18px; gap: 16px; }
  .navlinks { gap: 14px; font-size: 12px; }
  main { padding: 28px 16px; }
  .paneltitle { gap: 12px; }
  .paneltitle h1 { font-size: 27px; }
  .paneltitle, .toolbar { padding-left: 16px; padding-right: 16px; }
  .season { font-size: 11px; padding: 9px; }
  .count { padding-inline: 16px; }
  .method { padding: 20px; }
  .formula { font-size: 12px; }
  .teamheading { gap: 10px; }
  .dialoghead h2 { font-size: 19px; }
}
.method{margin-top:0}.method h2{font-size:32px}.metricmethod{margin-top:24px} main{max-width:1000px}
.navlinks { flex-wrap: wrap; }
.navlinks a { color: #18243c; }
.navlinks a[aria-current="page"] { color: #2864da; }
@media (max-width: 650px) { .nav { flex-wrap: wrap; gap: 14px; } }

/* Shared site navigation. */
.brand { font-size: 28px; }
.navlinks { font-size: 15px; gap: 26px; }
.navlinks a { transition: color 140ms ease; }
.navlinks a:hover, .navlinks a[aria-current="page"]:hover { color: #6b96eb; }
.navlinks a:focus-visible { outline: 2px solid #6b96eb; outline-offset: 5px; border-radius: 2px; }
@media (max-width: 700px) {
 .nav { flex-wrap: wrap; gap: 16px; }
 .brand { font-size: 26px; }
 .navlinks { font-size: 14px; gap: 16px; }
}

/* Shared navigation: current pages are labels, Eye Test opens a submenu. */
.nav, .navlinks { align-items: center; }
.navlinks > a, .navlinks > .current-page, .eye-nav > .eye-trigger { display: inline-flex; align-items: center; min-height: 40px; }
.current-page { color: #2864da; font-weight: 600; cursor: default; }
.eye-nav { position: relative; }
.eye-nav > .eye-trigger { color: #18243c; font: inherit; font-weight: 600; cursor: pointer; list-style: none; gap: 6px; }
.eye-nav > .eye-trigger::-webkit-details-marker { display: none; }
.eye-nav[data-active="true"] > .eye-trigger { color: #2864da; }
.eye-nav > .eye-trigger:hover, .eye-nav > .eye-trigger:focus-visible { color: #6b96eb; }
.nav-chevron { font-size: 11px; }
.eye-menu { display: none; position: absolute; left: -14px; top: 100%; z-index: 50; min-width: 220px; padding: 8px; background: white; border: 1px solid #dde3ed; border-radius: 9px; box-shadow: 0 10px 28px #18243c15; }
.eye-menu:not([hidden]) { display: grid; gap: 3px; }
.eye-menu[hidden] { display: none !important; }
.eye-menu a, .eye-menu .current-page { display: block; padding: 11px 12px; border-radius: 5px; white-space: nowrap; font-size: 14px; text-decoration: none; }
.eye-menu a:hover { color: #6b96eb; background: #f5f8ff; }
.eye-menu .current-page { background: #edf3ff; }
.laymaker-word { display: inline-flex; align-items: center; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; }
.layup-icon { width: .68em; height: .92em; margin: 0 -.03em 0 -.06em; flex: 0 0 auto; align-self: center; }
@media (max-width: 700px) {
 .navlinks { gap: 18px; }
 .eye-menu { left: auto; right: -15px; min-width: 200px; }
}

.laymaker-title .layup-icon { width: .68em; height: .92em; margin: 0 -.03em 0 -.06em; }
.eye-trigger { border: 0; padding: 0; background: transparent; font-family: inherit; }

/* Larger, stronger site navigation. */
.brand { font-size: 33px; font-weight: 850; letter-spacing: -1.1px; }
.navlinks { font-size: 17px; font-weight: 800; }
.navlinks > a, .navlinks > .current-page, .eye-nav > .eye-trigger { font-weight: 800; }
.laymaker-word { font-weight: 850; }
@media (max-width: 700px) {
 .brand { font-size: 30px; }
 .navlinks { font-size: 16px; gap: 17px; }
}

/* Identical navigation typography on every page, including active labels. */
header .navlinks { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; gap: 26px; }
header .navlinks > a, header .navlinks > .current-page, header .eye-nav > .eye-trigger { font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1.3; min-height: 44px; }
header .navlinks .laymaker-word { font-size: inherit; font-weight: 650; }
header .eye-menu a, header .eye-menu .current-page { font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.4; }
@media (max-width: 700px) {
 header .navlinks { font-size: 16px; gap: 16px; }
 header .navlinks > a, header .navlinks > .current-page, header .eye-nav > .eye-trigger { font-size: 16px; }
 header .eye-menu a, header .eye-menu .current-page { font-size: 14px; }
}


header .navlinks { gap: 24px; flex-wrap: wrap; }
header .navlinks > a, header .navlinks > .current-page { gap: .28em; white-space: nowrap; }

@media (max-width: 700px) { header .navlinks { gap: 8px 18px; } }

/* Compact mobile header; full desktop navigation stays visible. */
header .nav { position: relative; }
.mobile-menu-toggle { display: none; }
@media (max-width: 700px) {
 header .nav { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 10px; padding: 12px 16px; }
 header .brand { font-size: 29px; flex-shrink: 0; }
 .mobile-menu-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 11px; border: 1px solid #dde3ed; border-radius: 7px; background: white; color: #18243c; font-family: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
 .mobile-menu-toggle svg { width: 18px; height: 18px; }
 .mobile-menu-toggle:focus-visible { outline: 2px solid #2864da; outline-offset: 3px; }
 header .navlinks { display: none; position: absolute; top: calc(100% - 2px); right: 12px; left: 12px; z-index: 100; padding: 8px; border: 1px solid #dde3ed; border-radius: 9px; background: white; box-shadow: 0 10px 25px #18243c18; gap: 0; }
 header .nav.mobile-menu-open .navlinks { display: flex; flex-direction: column; align-items: stretch; }
 header .navlinks > a, header .navlinks > .current-page { width: 100%; padding: 11px 13px; border-radius: 5px; min-height: 44px; font-size: 16px; }
 header .navlinks > a:hover { background: #f5f8ff; }
 header .navlinks > .current-page { background: #edf3ff; }
}


/* Subtle separators between desktop navigation links only. */
@media (min-width: 701px) {
 header .navlinks > a, header .navlinks > .current-page { position: relative; }
 header .navlinks > a + a::before,
 header .navlinks > a + .current-page::before,
 header .navlinks > .current-page + a::before {
  content: ""; position: absolute; left: -12px; top: 50%;
  transform: translateY(-50%); width: 1px; height: 20px;
  background: rgba(24, 45, 80, 0.18); pointer-events: none;
 }
}


/* LAYmaker daily board. */
[hidden]{display:none!important}
main.lay-board{max-width:1320px;padding:34px 32px 65px}
.board-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}

.board-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:22px;align-items:start}
.main-board,.side-board{display:grid;gap:22px;min-width:0}
.bet-panel{background:white;border:1px solid #dce3ed;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px #18243c04}
.bet-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px;border-bottom:1px solid #e6ebf2}

<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>

<button class="btn" id="reset-password" type="button">Forgot password?</button>
</form>

<script>
(() => {
 const $=id=>document.getElementById(id),client=window.ofredAuth;
 let mode='signin',recovery=false,busy=false;
 const message=text=>$('account-message').textContent=text;
 function setMode(next){mode=next;$('submit-account').textContent=next==='signup'?'Create account':'Sign in';$('password').autocomplete=next==='signup'?'new-password':'current-password';$('sign-in-tab').setAttribute('aria-pressed',String(next==='signin'));$('sign-up-tab').setAttribute('aria-pressed',String(next==='signup'));message('');}
 async function sessionView(session){
  document.querySelector('.account-tabs').hidden=!!session || recovery;
  $('signed-in').hidden=!session;
  if(session&&!recovery){$('account-form').hidden=true;message('Signed in as '+session.user.email+'. Open LAYmaker to check your access.');}
  else $('account-form').hidden=false;
 }
 if(!client){message('Account service unavailable. Please reload and try again.');$('submit-account').disabled=true;return;}
 $('sign-in-tab').onclick=()=>setMode('signin');
 $('sign-up-tab').onclick=()=>setMode('signup');
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){recovery=true;$('email').required=false;$('email').hidden=true;document.querySelector('label[for="email"]').hidden=true;$('password').autocomplete='new-password';$('submit-account').textContent='Save new password';$('reset-password').hidden=true;message('Enter a new password.');}
  sessionView(session);
 });
 $('account-form').onsubmit=async event=>{
  event.preventDefault();if(busy)return;busy=true;$('submit-account').disabled=true;message('Please wait...');
  try{
   const email=$('email').value.trim(),password=$('password').value;let result;
   if(recovery){result=await client.auth.updateUser({password});if(result.error)throw result.error;recovery=false;message('Password updated. You are signed in.');$('account-form').hidden=true;$('signed-in').hidden=false;}
   else if(mode==='signup'){result=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/account.html'}});if(result.error)throw result.error;message('Check your email to confirm your account, then sign in. LAYmaker access requires approval.');if(result.data.session)sessionView(result.data.session);}
   else{result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;sessionView(result.data.session);}
  }catch(e){message(e.message||'Unable to complete this request.');}
  finally{busy=false;$('submit-account').disabled=false;}
 };
 $('reset-password').onclick=async()=>{
  const email=$('email').value.trim();if(!email||!$('email').checkValidity()){message('Enter your email address first.');return;}
  $('reset-password').disabled=true;
  try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/account.html'});if(error)throw error;message('If that account exists, a password reset link will be emailed to you.');}catch(e){message(e.message);}finally{$('reset-password').disabled=false;}
 };
 $('sign-out').onclick=async()=>{const {error}=await client.auth.signOut();if(error){message(error.message);return;}recovery=false;sessionView(null);message('Signed out.');};
})();
</script><script data-mobile-navigation="v1">
(() => {
 const nav = document.querySelector('header .nav');
 const trigger = nav.querySelector('.mobile-menu-toggle');
 const links = nav.querySelector('.navlinks');
 const mobile = window.matchMedia('(max-width: 700px)');
 const close = () => {
  nav.classList.remove('mobile-menu-open');
  trigger.setAttribute('aria-expanded', 'false');
 };
 trigger.addEventListener('click', () => {
  const open = !nav.classList.contains('mobile-menu-open');
  nav.classList.toggle('mobile-menu-open', open);
  trigger.setAttribute('aria-expanded', String(open));
 });
 document.addEventListener('pointerdown', event => { if (!nav.contains(event.target)) close(); });
 document.addEventListener('click', event => { if (!nav.contains(event.target)) close(); });
 document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
   const wasOpen = nav.classList.contains('mobile-menu-open');
   close();
   if (wasOpen) trigger.focus();
  }
 });
 nav.addEventListener('focusout', event => { if (!nav.contains(event.relatedTarget)) close(); });
 links.addEventListener('click', event => { if (event.target.closest('a')) close(); });
 mobile.addEventListener('change', close);
 close();
})();
</script></body></html>
