<style>
:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #18243c;
  background: #f5f7fa;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; }
header { background: white; border-bottom: 1px solid #dde3ed; }
.nav {
  max-width: 1320px;
  padding: 21px 32px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 36px;
}
.brand {
  text-decoration: none;
  font-weight: 800;
  font-size: 23px;
  letter-spacing: -1px;
  white-space: nowrap;
}
.brand span { color: #2864da; }
.navlinks {
  display: flex;
  gap: 25px;
  font-size: 13px;
  font-weight: 600;
}
.navlinks a { text-decoration: none; }
.navlinks a:first-child { color: #2864da; }
main { max-width: 1320px; margin: auto; padding: 40px 32px; }
.eyebrow {
  color: #2864da;
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: 750;
  text-transform: uppercase;
}
p { color: #69758b; font-size: 14px; line-height: 1.7; }
.season {
  border: 1px solid #d9e1ec;
  background: white;
  border-radius: 6px;
  padding: 11px 16px;
  font-size: 13px;
  font-weight: 650;
  white-space: nowrap;
}
.panel {
  background: white;
  border: 1px solid #dde3ed;
  border-radius: 9px;
  overflow: hidden;
}
.paneltitle {
  padding: 28px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.paneltitle h1 {
  font-size: 34px;
  letter-spacing: -1px;
  margin: 8px 0 0;
  font-weight: 800;
}
.toolbar {
  padding: 20px 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
input, select, button { font: inherit; }
input[type=search], select {
  background: #f8f9fc;
  border: 1px solid #dce3ed;
  border-radius: 6px;
  padding: 11px 13px;
  font-size: 13px;
  color: #25344f;
}
input[type=search] { min-width: 170px; flex: 1; }
button { cursor: pointer; }
.btn {
  background: white;
  border: 1px solid #dce3ed;
  border-radius: 6px;
  padding: 10px 14px;
  color: #25344f;
  font-size: 12px;
}
button:hover { background: #edf3fe; }
button:focus-visible, a:focus-visible,
input:focus-visible, select:focus-visible {
  outline: 2px solid #2864da;
  outline-offset: 3px;
}
.tablewrap { overflow: auto; max-height: 700px; }
table {
  border-collapse: collapse;
  width: 100%;
  white-space: nowrap;
  text-align: left;
}
th {
  position: sticky;
  top: 0;
  background: #f6f8fc;
  z-index: 1;
  border-block: 1px solid #e6eaf1;
}
th button {
  width: 100%;
  border: 0;
  background: none;
  padding: 13px 16px;
  text-align: left;
  font-size: 10px;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: #68768d;
  font-weight: 700;
}
td {
  padding: 11px 16px;
  border-bottom: 1px solid #eff2f6;
  font-size: 12px;
}
tr:hover td { background: #f7faff; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.num button { text-align: right; }
.teamlink {
  display: flex;
  align-items: center;
  gap: 11px;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 650;
  color: #172840;
  font-size: 13px;
  text-align: left;
}
.logoslot {
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.logoslot img { width: 100%; height: 100%; object-fit: contain; }
.logoslot.large { width: 56px; height: 56px; }
.rankcell { color: #6a7890; }
.score { font-weight: 750; color: #2864da; background: #f7faff; }
.count {
  padding: 15px 24px;
  color: #748095;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.notice {
  font-size: 12px;
  color: #65728a;
  margin-top: 14px;
  line-height: 1.6;
}
.notice[hidden] { display: none; }
.method {
  margin-top: 35px;
  padding: 25px;
  background: white;
  border: 1px solid #dde3ed;
  border-radius: 9px;

.method h2 { margin: 0 0 14px; font-size: 25px; }
.method h3 { font-size: 16px; }
.method h3 span {
  font-size: 11px;
  background: #edf3fe;
  color: #2864da;
  border-radius: 4px;
  padding: 5px 8px;
  margin-left: 8px;
}

  background: #f2f5fb;
  border-left: 3px solid #2864da;
  padding: 17px;
}
.method p { max-width: 840px; }
.method small { color: #748095; line-height: 1.6; display: block; }
footer {

  color: #8993a4;

  gap: 16px;
  flex-wrap: wrap;
  padding: 28px 0;

  border: 1px solid #dce3ed;
  border-radius: 12px;
  max-width: 550px;
  width: calc(100% - 32px);
  padding: 26px;
  color: #18243c;

dialog::backdrop { background: #13223b70; }
.dialoghead {

.teamheading { display: flex; align-items: center; gap: 14px; }
.dialoghead h2 { margin: 0; font-size: 23px; }

.detailgrid strong { font-size: 22px; }

#column-tip span {

  font-size: 12px;
  line-height: 1.6;
  color: #dce6f7;

.visually-hidden {
  position: absolute;
  clip-path: inset(100%);
  width: 1px;
  height: 1px;
  overflow: hidden;
}
@media (max-width: 700px) {

  .method { padding: 20px; }
  .formula { font-size: 12px; }
  .teamheading { gap: 10px; }
  .dialoghead h2 { font-size: 19px; }

/* Compact rankings with document-level vertical scrolling. */
main { padding: 24px 24px; }
.panel { overflow: visible; }
.paneltitle { padding: 20px 18px 0; }
.paneltitle h1 { font-size: 28px; margin-top: 5px; }
.toolbar { padding: 14px 18px; gap: 9px; }
input[type=search], select { padding: 8px 11px; font-size: 12px; }
.btn { padding: 8px 11px; }
.tablewrap { overflow: visible; max-height: none; }
th button { padding: 10px 10px; font-size: 10px; }

.teamlink { font-size: 12px; gap: 8px; }

  .paneltitle { padding: 16px 12px 0; }

  .toolbar { padding: 12px; }

  th button { padding: 9px 8px; font-size: 9px; }
  td { padding: 4px 8px; font-size: 11px; }
  .teamlink { font-size: 11px; }

const $ = id => document.getElementById(id);

const columns = [
  ['rank', 'Rank'],
  ['team', 'Team'],
  ['conference', 'Conference'],
  ['record', 'Record'],
  ['ppg', 'PPG'],
  ['turnovers_per_game', 'TO / game'],
  ['rating', 'PPT']
];

const definitions = {
  rank: ['Rank', 'Teams ordered by PPT, highest first. Equal PPT values share a rank.'],
  team: ['Team', 'Select a team to view its statistics.'],
  conference: ['Conference', 'The conference reported in the dataset.'],
  record: ['Record', 'Season wins – season losses.'],
  ppg: ['Points per game', 'Total points in rated games ÷ number of rated games.'],
  turnovers_per_game: ['Turnovers per game', 'Total turnovers in rated games ÷ number of rated games.'],
  rating: ['Points per turnover (PPT)', 'PPG ÷ turnovers per game, using the same games for both averages.']
};

let dataset = null;
let sortKey = 'rank';
let direction = 1;

const numeric = ['rank', 'ppg', 'turnovers_per_game', 'rating'];

function makeLogo(row, large = false) {
  const slot = document.createElement('span');
  slot.className = 'logoslot' + (large ? ' large' : '');

  const id = teamLogoIds[row.team];

  if (id) {
    const image = document.createElement('img');
    image.src = 'https://a.espncdn.com/i/teamlogos/ncaa/500/' + id + '.png';
    image.alt = '';
    image.width = large ? 56 : 28;
    image.height = large ? 56 : 28;
    image.loading = large ? 'eager' : 'lazy';
    image.decoding = 'async';
    image.onerror = () => image.remove();
    slot.append(image);
  }

  return slot;
}

function showTip(button, key) {
  const tip = $('column-tip');
  tip.children[0].textContent = definitions[key][0];
  tip.children[1].textContent = definitions[key][1];
  tip.hidden = false;

  const box = button.getBoundingClientRect();
  tip.style.left = Math.max(12, Math.min(box.left, innerWidth - 292)) + 'px';
  tip.style.top = Math.min(box.bottom + 9, innerHeight - tip.offsetHeight - 12) + 'px';
}

function hideTip() {
  $('column-tip').hidden = true;
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') hideTip();
});
window.addEventListener('scroll', hideTip, true);

function value(row, key) {
  if (key === 'record') {
    return `${row.wins ?? '—'}–${row.losses ?? '—'}`;
  }
  return row[key];
}

function fmt(value, key) {
  if (value == null) return '—';

  if (typeof value === 'number' &&
      ['ppg', 'turnovers_per_game', 'rating'].includes(key)) {
    return value.toFixed(2);
  }

  return String(value);
}

function validate(data) {
  if (!Array.isArray(data.rankings) || !data.rankings.length) {
    throw Error('The file must contain a nonempty rankings array.');
  }

  for (const row of data.rankings) {
    if (typeof row.team !== 'string' ||
        (row.rating != null && !Number.isFinite(row.rating))) {
      throw Error('Each row needs a team name and a numeric rating or null.');
    }
  }

  return data;
}

function apply(data) {
  dataset = validate(data);

  if (Number.isInteger(data.season)) {
    $('season').textContent =
      `${data.season - 1}–${String(data.season).slice(-2)} season`;
  }

  $('conference').replaceChildren(new Option('All conferences', ''));

  [...new Set(data.rankings.map(row => row.conference).filter(Boolean))]
    .sort()
    .forEach(conference => {
      $('conference').add(new Option(conference, conference));
    });

  render();
}

function filtered() {
  const query = $('search').value.toLowerCase().trim();
  const conference = $('conference').value;

  return dataset.rankings
    .filter(row =>
      row.team.toLowerCase().includes(query) &&
      (!conference || row.conference === conference)
    )
    .sort((a, b) => {
      const av = value(a, sortKey);
      const bv = value(b, sortKey);

      if (av == null) return bv == null ? 0 : 1;
      if (bv == null) return -1;

      const difference = numeric.includes(sortKey)
        ? Number(av) - Number(bv)
        : String(av).localeCompare(String(bv));

      return difference * direction || a.team.localeCompare(b.team);
    });
}

function render() {
  if (!dataset) return;

  $('head').replaceChildren();

  for (const [key, label] of columns) {
    const th = document.createElement('th');
    th.scope = 'col';

    if (key === sortKey) {
      th.setAttribute(
        'aria-sort',
        direction === 1 ? 'ascending' : 'descending'
      );
    }

    if (!['team', 'conference', 'record'].includes(key)) {
      th.className = 'num';
    }

    const button = document.createElement('button');
    button.textContent = label +
      (sortKey === key ? (direction === 1 ? ' ↑' : ' ↓') : '');

    button.setAttribute('aria-describedby', 'column-tip');
    button.onmouseenter = () => showTip(button, key);
    button.onfocus = () => showTip(button, key);
    button.onmouseleave = hideTip;
    button.onblur = hideTip;

    button.onclick = () => {
      hideTip();
      direction = sortKey === key
        ? -direction
        : (['rating', 'ppg'].includes(key) ? -1 : 1);
      sortKey = key;
      render();
    };

    th.append(button);
    $('head').append(th);
  }

  const rows = filtered();
  $('body').replaceChildren();

  for (const row of rows) {
    const tr = document.createElement('tr');

    for (const [key] of columns) {
      const td = document.createElement('td');

      if (key === 'team') {
        const button = document.createElement('button');
        const name = document.createElement('span');

        button.className = 'teamlink';
        name.textContent = row.team;

        button.append(makeLogo(row), name);
        button.onclick = () => showTeam(row);
        td.append(button);
      } else {
        td.textContent = fmt(value(row, key), key);
      }

      if (!['team', 'conference', 'record'].includes(key)) {
        td.className = 'num';
      }

      if (key === 'rank') td.classList.add('rankcell');
      if (key === 'rating') td.classList.add('score');

      tr.append(td);
    }

    $('body').append(tr);
  }

  if (!rows.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = columns.length;
    td.textContent = 'No teams match your filters.';

    tr.append(td);
    $('body').append(tr);
  }

  $('count').textContent =
    `${rows.length} of ${dataset.rankings.length} teams`;
}

function showTeam(row) {
  $('detaillogo').replaceChildren(makeLogo(row, true));
  $('detailname').textContent = row.team;
  $('detailconf').textContent =
    (row.conference || 'Conference unavailable') +
    ' · ' + value(row, 'record') + ' record';

  $('detailstats').replaceChildren();

  const stats = [
    ['Rank', fmt(row.rank, 'rank')],
    ['PPT', fmt(row.rating, 'rating')],
    ['Points per game', fmt(row.ppg, 'ppg')],
    ['Turnovers per game', fmt(row.turnovers_per_game, 'turnovers_per_game')]
  ];

  for (const [label, stat] of stats) {
    const div = document.createElement('div');
    const small = document.createElement('small');
    const strong = document.createElement('strong');

    small.textContent = label;
    strong.textContent = stat;

    div.append(small, strong);
    $('detailstats').append(div);
  }

  $('detail').showModal();
}

$('close').onclick = () => $('detail').close();
$('search').oninput = render;
$('conference').onchange = render;

$('clear').onclick = () => {
  $('search').value = '';
  $('conference').value = '';
  render();
};

async function loadPublished() {
  const response = await fetch('rankings.json', { cache: 'no-store' });

  if (!response.ok) {
    throw Error('Could not load rankings.json (' + response.status + ').');
  }

  apply(await response.json());
}

loadPublished().catch(error => {
  $('count').textContent = 'Rankings unavailable';
  $('notice').hidden = false;
  $('notice').textContent =
    'Unable to load team rankings. Please try again later.';
  console.error(error);
});
</script>
</body>
</html>
