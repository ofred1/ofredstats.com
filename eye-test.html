<script>
const eyeData = JSON.parse(document.getElementById('eye-test-data').textContent);
const teamDirectory = new Map(eyeData.teams.map(team => [team.team, team]));
// Add future editions chronologically after Preseason; rankings are {rank, team}.
// Published editions remain frozen so readers can revisit past weeks.
let selectedEdition = eyeData.editions[eyeData.editions.length - 1].id;
function movementFor(team, rank, previous) {
 if (!previous) return {text: '—', style: 'flat', label: 'No previous rankings'};
 const old = previous.rankings.find(row => row.team === team);
 if (!old) return {text: 'NEW', style: 'new', label: 'New to the Top 30'};
 const difference = old.rank - rank;
 if (difference > 0) return {text: '▲ ' + difference, style: 'up', label: 'Up ' + difference + ' places'};
 if (difference < 0) return {text: '▼ ' + Math.abs(difference), style: 'down', label: 'Down ' + Math.abs(difference) + ' places'};
 return {text: '—', style: 'flat', label: 'Unchanged'};
}
function renderEyeTest() {
 const position = eyeData.editions.findIndex(edition => edition.id === selectedEdition);
 const edition = eyeData.editions[position];
 const previous = position > 0 && eyeData.editions[position - 1].rankings.length
   ? eyeData.editions[position - 1] : null;
 const buttons = document.getElementById('editions');
 buttons.replaceChildren();
 eyeData.editions.forEach(item => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'edition';
  button.textContent = item.label;
  button.setAttribute('aria-pressed', String(item.id === selectedEdition));
  button.onclick = () => { selectedEdition = item.id; renderEyeTest();
   [...buttons.children].find(b => b.textContent === item.label)?.focus(); };
  buttons.append(button);
 });
 document.getElementById('edition-caption').textContent = edition.label + ' Top 30';
 const body = document.getElementById('eye-rows');
 body.replaceChildren();
 const rows = [...edition.rankings].sort((a, b) => a.rank - b.rank);
 if (!rows.length) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 4; td.className = 'empty';
  td.textContent = edition.label + ' rankings will appear here when published.';
  tr.append(td); body.append(tr);
 }
 rows.forEach(row => {
  const team = teamDirectory.get(row.team);
  const tr = document.createElement('tr');
  const rank = document.createElement('td'); rank.textContent = row.rank;
  const school = document.createElement('td');
  const identity = document.createElement('div'); identity.className = 'eye-team';
  const logo = document.createElement('span'); logo.className = 'eye-logo';
  if (team?.logo) {
   const img = document.createElement('img');
   img.src = 'https://a.espncdn.com/i/teamlogos/ncaa/500/' + team.logo + '.png';
   img.alt = ''; img.width = 46; img.height = 46; img.loading = 'lazy';
   img.onerror = () => img.remove(); logo.append(img);
  }
  const name = document.createElement('span'); name.textContent = row.team;
  identity.append(logo, name); school.append(identity);
  const delta = movementFor(row.team, row.rank, previous);
  const movement = document.createElement('td');
  movement.className = 'movement ' + delta.style;
  movement.textContent = delta.text; movement.setAttribute('aria-label', delta.label);
  const conference = document.createElement('td'); conference.className = 'eye-conf';
  conference.textContent = team?.conference || '—';
  tr.append(rank, school, movement, conference); body.append(tr);
 });
 document.getElementById('edition-status').textContent = edition.label + ': ' +
  (rows.length ? rows.length + ' ranked teams' : 'rankings not yet published');
}
renderEyeTest();
</script>
